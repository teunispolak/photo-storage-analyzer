name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.runner }} / ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            python: /usr/bin/python3
          - runner: macos-26
            python: /usr/bin/python3
          - runner: macos-26
            python: python3
    steps:
      - uses: actions/checkout@v5

      - name: Install DuckDB
        run: brew install duckdb

      - name: Run tests
        env:
          PYTHON: ${{ matrix.python }}
        run: zsh tests/run_tests.sh
